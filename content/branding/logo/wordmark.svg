<?xml version="1.0" encoding="UTF-8"?>
<!--
  Numen — текстовый логотип (wordmark)
  Используется как имя бренда в шапках, лендингах, обложке канала.
  Соотношение примерно 4:1, размер 800x200 (масштабируется).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
      .word { fill: #F5F5F0; font-family: 'Playfair Display', Georgia, serif; font-weight: 700; }
      .dot { fill: #C9A961; }
    </style>
  </defs>

  <!-- Background (transparent — use on dark surface) -->
  <rect fill="#0A0A0A" width="800" height="200"/>

  <!-- Wordmark "Numen" -->
  <text class="word" x="80" y="130" font-size="120" letter-spacing="2">Numen</text>

  <!-- Gold accent dot after the word (visual "period" / signature) -->
  <circle class="dot" cx="610" cy="130" r="10"/>
</svg>
